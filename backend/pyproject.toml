[project]
name = "sangyan-shield-backend"
version = "0.1.0"
description = "Sangyan Shield: investment-fraud risk indicators API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "rapidfuzz>=3.9",
  "pyyaml>=6",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "tldextract>=5.1",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools]
packages = []
